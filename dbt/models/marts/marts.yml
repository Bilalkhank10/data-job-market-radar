version: 2

models:
  - name: fct_job_postings
    description: One row per job (latest version) + lifecycle across snapshots.
    columns:
      - name: job_key
        tests: [unique, not_null]
      - name: title
        tests: [not_null]
      - name: seniority
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['intern', 'junior', 'mid', 'senior']
      - name: first_seen_date
        tests: [not_null]

  - name: fct_skill_mentions
    description: Job × skill rows (latest posting version).
    columns:
      - name: mention_id
        tests: [unique, not_null]
      - name: skill
        tests:
          - not_null
          - relationships:
              to: ref('skill_taxonomy')
              field: skill

  - name: agg_skill_demand
    columns:
      - name: skill
        tests: [unique, not_null]

  - name: agg_skill_by_snapshot
    columns:
      - name: skill
        tests: [not_null]

  - name: agg_salary_benchmarks
    description: Salary percentiles by role family × seniority (USD, remote).
