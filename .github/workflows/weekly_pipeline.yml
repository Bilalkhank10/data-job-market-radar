name: Weekly job-market refresh

on:
  schedule:
    - cron: "0 4 * * 1"         # Mondays 09:00 PKT
  workflow_dispatch: {}
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore warehouse cache (history accumulation)
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: warehouse.duckdb
          key: jobradar-warehouse-v1
          restore-keys: jobradar-warehouse-

      - name: Ingest postings
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python ingestion/run_ingestion.py --offline
          else
            python ingestion/run_ingestion.py
          fi

      - name: dbt build (seed + models + tests)
        run: |
          cd dbt
          dbt seed --profiles-dir .
          dbt build --profiles-dir .

      - name: Source freshness
        run: cd dbt && dbt source freshness --profiles-dir .

      - name: Upload warehouse artifact
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-duckdb
          path: warehouse.duckdb
          retention-days: 30
